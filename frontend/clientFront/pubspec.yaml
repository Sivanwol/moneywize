name: Client_Front
description: Client Front
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
authors:
  - Sivan Wolberg<sivan@wolberg.pro>

environment:
  sdk: '>=3.1.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  retrofit: ^2.0.1
  json_annotation: ^4.0.0
  carousel_slider: ^4.0.0

  #object builder
  freezed: ^0.14.1

  #format date time and other formats
  intl: any

  firebase_remote_config: ^4.3.4
  firebase_core: ^2.22.0
  firebase_messaging: ^14.7.4
  firebase_crashlytics: ^3.4.4
  get_it: ^7.6.4
  get: ^4.6.6
  easy_localization: ^3.0.3
  permission_handler: ^11.0.1
  dio: ^5.3.3
  cached_network_image: ^3.3.0
  font_awesome_flutter: ^10.6.0
  provider: ^6.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  meta: ^1.1.6
  uuid: "3.0.1"
  retrofit_generator: ^2.1.0
  build_runner: ^2.0.0
  json_serializable: any
  flutter_lints: ^3.0.1
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/
    - assets/translations/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: SF-PRO
      fonts:
        - asset: fonts/SF-Pro-Text-Bold.oft
          weight: 600
        - asset: fonts/SF-Pro-Text-Light.otf
          weight: 300
        - asset: fonts/SF-Pro-Text-Regular.otf
          weight: 500
        - asset: fonts/SF-Pro-Text-Semibold.otf
          weight: 500
    - family: SF-PRO-Display
      fonts:
        - asset: fonts/SF-Pro-Display-Regular.ttf
          weight: 400
        - asset: fonts/SF-Pro-Display-Bold.ttf
          weight: 400
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
